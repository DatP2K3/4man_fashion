spring:
  application:
    name: product-service

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${DBMS_CONNECTION:jdbc:postgresql://localhost:5433/product_db}
    username: ${DBMS_USERNAME:postgres}
    password: ${DBMS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog-master.xml

  doc:
    swagger-ui:
      path: /swagger-doc/product/swagger-ui.html
    api-docs:
      path: /swagger-doc/v3/api-docs/product

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_URI:http://localhost:8180/realms/IamService}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD}

rabbitmq:
  exchange:
    product: product.exchange
    product-dlx: product.exchange.dlx
    file: file.exchange
  queue:
    product:
      update-variant: product.queue.update-variant
      dlq: product.queue.dlq
  routing:
    product:
      update-variant: product.update-variant
      dlk: product.dlk
    key:
      product:
        create: product.create
        update: product.update
        delete: product.delete
        update-all: product.update-all
      file:
        update: file.update

server:
  port: ${SERVER_PORT:8765}

management:
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true