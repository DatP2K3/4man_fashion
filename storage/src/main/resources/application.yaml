spring:
  application:
    name: storage-service

  main:
    banner-mode: off
    allow-bean-definition-overriding: true

  web:
    resources:
      static-locations: classpath:/static/, file:/uploads/public/, file:/uploads/private/

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${DBMS_CONNECTION:jdbc:postgresql://localhost:5433/storage_db}
    username: ${DBMS_USERNAME:postgres}
    password: ${DBMS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:/db/changelog-master.xml

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_URI:http://localhost:8180/realms/IamService}

  doc:
    swagger-ui:
      path: i
    api-docs:
      path: /swagger-doc/v3/api-docs/storage

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD}

rabbitmq:
  exchange:
    file: file.exchange
    file-dlx: file.exchange.dlx
  queue:
    file:
      update: file.queue.update
      dlq: file.queue.dlq
  routing:
    file:
      update: file.update
      dlk: file.dlk

server:
  port: ${SERVER_PORT:8080}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

file:
  allowed-types: image/jpeg,image/png,application/pdf
  allowed-extensions: jpg,png,pdf
  upload-dir:
    public: uploads/public
    private: uploads/private

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true