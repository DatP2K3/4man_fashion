spring:
  application:
    name: location-service

  datasource:
    url: ${DBMS_CONNECTION:jdbc:postgresql://localhost:5433/location_db}
    username: ${DBMS_USERNAME:postgres}
    password: ${DBMS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_URI:http://localhost:8180/realms/IamService}

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:6969/}"

  doc:
    swagger-ui:
      path: /swagger-doc/location/swagger-ui.html
    api-docs:
      path: /swagger-doc/v3/api-docs/location

  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.xml

server:
  port: ${SERVER_PORT:8111}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
