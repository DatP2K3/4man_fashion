spring:
  application:
    name: elasticsearch-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_URI:http://localhost:8180/realms/IamService}

rabbitmq:
  exchange:
    product: product.exchange
    product-dlx: product.exchange.dlx
  queue:
    product:
      create: product.queue.create
      update: product.queue.update
      update-all: product.queue.update-all
      delete: product.queue.delete
      dlq: product.queue.dlq
  routing:
    product:
      create: product.create
      update: product.update
      delete: product.delete
      update-all: product.update-all
      dlk: product.dlk

  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}

server:
  port: ${SERVER_PORT:5566}

logging:
  level:
    org.springframework.cloud.consul: DEBUG
    org.springframework.cloud.consul.discovery: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true