spring:
  application:
    name: shopinfo-service

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${DBMS_CONNECTION:jdbc:postgresql://localhost:5433/shop_info_db}
    username: ${DBMS_USERNAME:postgres}
    password: ${DBMS_PASSWORD:14062003}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  liquibase:
    change-log: classpath:/db/changelog-master.xml

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_URI:http://localhost:8180/realms/IamService}

  doc:
    swagger-ui:
      path: /swagger-doc/shopinfo/swagger-ui.html
    api-docs:
      path: /swagger-doc/v3/api-docs/shopinfo

server:
  port: 8222

management:
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
